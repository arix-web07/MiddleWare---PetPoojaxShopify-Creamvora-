
name: Cremevora Middleware Tests

on:
  push:
    branches:
      - fix/petpooja-menu-mapping
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Petpooja parser tests
        run: npx vitest run tests/petpooja-menu-parser.test.ts
